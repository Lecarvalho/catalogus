# yaml-language-server: $schema=https://dagstree.dev/schema/v1.json
#
# Layer 2 manifest — safe to commit. Cost, billing and account references are
# Layer 3 and live in the private overlay, never here.
#
# Service entries below are drawn from configuration keys in
# src/backend/Sluglin.Api/appsettings*.json and the fly.*.toml app definitions.
# Providers mentioned only in prose (Stability, Replicate, fal.ai) are
# deliberately absent — a documentation mention is not a dependency.

dagstree: 1

project:
  name: Clapline
  slug: clapline
  architecture: "two-tier: .NET 10 Web API backend (Domain, Application, Infrastructure, Api layers) + React 19 + Vite SPA, single origin behind a reverse proxy"
  pm: "Trello kanban, board is source of truth for active work"
  vcs:
    provider: github
    visibility: private
  coding_agents:
    - claude-code
    - codex

services:
  # --- hosting: four Fly apps, one per deployed unit -----------------------
  - id: fly-api
    service: fly-io
    role: hosting-api
    added: 2025-11-02
    notes: "app clapline-api, region yyz, internal port 8080"
  - id: fly-web
    service: fly-io
    role: hosting-web
    added: 2025-11-02
    notes: "app clapline-web, serves the SPA and proxies to the API"
  - id: fly-grafana
    service: fly-io
    role: hosting-observability
    added: 2025-11-02
    notes: "app clapline-grafana, internal port 3000"
  - id: fly-loki
    service: fly-io
    role: hosting-logs
    added: 2025-11-02
    notes: "app clapline-loki, internal port 3100"

  # --- data and identity ---------------------------------------------------
  - id: supabase-db
    service: supabase
    role: database
    added: 2025-11-02
    notes: "separate projects per environment, dev and prod"
  - id: supabase-auth
    service: supabase
    role: auth
    added: 2025-11-02

  # --- AI providers, all called from the backend ---------------------------
  - id: gemini
    service: google-vertex-ai
    role: ai-models
    added: 2025-11-02
    notes: "Vertex project and location configured; also a temp bucket for native video"
  - id: openai
    service: openai
    role: ai-models
    added: 2025-11-02
  - id: anthropic
    service: anthropic
    role: ai-models
    added: 2025-11-02
  - id: xai
    service: xai
    role: ai-models
    added: 2026-01-15
  - id: elevenlabs
    service: elevenlabs
    role: ai-voice
    added: 2025-11-02

  # --- supporting services -------------------------------------------------
  - id: s3
    service: aws-s3
    role: storage
    added: 2025-11-02
  - id: resend
    service: resend
    role: email
    added: 2025-11-02
    notes: "delivered through the outbox worker, not called inline"
  - id: stripe
    service: stripe
    role: payments
    added: 2026-01-15
  - id: grafana
    service: grafana
    role: analytics
    added: 2025-11-02
  - id: loki
    service: grafana-loki
    role: logging
    added: 2025-11-02
    notes: "receives backend telemetry over OTLP"

  # --- delivery ------------------------------------------------------------
  - id: github
    service: github
    role: vcs
    added: 2025-11-02
  - id: github-actions
    service: github-actions
    role: ci
    added: 2025-11-02
  - id: trello
    service: trello
    role: pm
    added: 2025-11-02

dependencies:
  # the SPA is served by fly-web and talks to the API over a single origin
  - [fly-web, fly-api]

  # everything the API reaches out to
  - [fly-api, supabase-db]
  - [fly-api, supabase-auth]
  - [fly-api, gemini]
  - [fly-api, openai]
  - [fly-api, anthropic]
  - [fly-api, xai]
  - [fly-api, elevenlabs]
  - [fly-api, s3]
  - [fly-api, resend]
  - [fly-api, stripe]
  - [fly-api, loki]

  # auth sits on top of the same Supabase project as the database
  - [supabase-auth, supabase-db]

  # observability chain
  - [fly-grafana, grafana]
  - [grafana, loki]
  - [fly-loki, loki]

  # delivery chain
  - [github-actions, github]
  - [github-actions, fly-api]
  - [github-actions, fly-web]
